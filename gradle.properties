# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# 说明:实际的版本矩阵定义在 build.gradle 中,默认目标为 1.20.1。
# 构建 1.20.4 版本请使用:gradlew build -Ptarget=1.20.4
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.3
loom_version=1.17.16

# Mod Properties
# 版本递增规则:每次构建在基础版本后追加 .build.N(N 每次构建 +1);用户另行指定版本号时以用户要求为准。
# 当前基础版本 1.1-beta1,本次为第 7 次构建。
mod_version=1.1-beta1.build.7
maven_group=top.s1metro.s1mtr

# Dependencies
fabric_api_version=0.92.11+1.20.1
# Fabric API 子模块(fabric-networking-api-v1)使用与聚合包配套的独立版本号,
# 见 https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.92.11+1.20.1/ 的 POM。
fabric_networking_api_version=1.3.15+0caff8d077
mtr_version=7916237
modmenu_version=9.0.0
